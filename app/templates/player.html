<style>
.plwrap{background:#0d1526;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow);}
.plvideo{position:relative;border-radius:12px;overflow:hidden;background:#000;}
.plvideo video{width:100%;display:block;max-height:56vh;object-fit:contain;background:#000;}
.plctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;}
.plbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#16203a;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;}
.plbtn:hover{background:#22304d;}
.plbtn.sm{width:30px;height:30px;font-size:13px;border-radius:8px;}
.plclock{font-variant-numeric:tabular-nums;font-weight:800;font-size:24px;color:var(--accent);letter-spacing:.5px;}
.plfile{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;}
.tlmain{position:relative;height:48px;background:#0a1120;border:1px solid var(--line);border-radius:10px;margin-top:12px;cursor:pointer;overflow:hidden;}
.tlmain .seg{position:absolute;top:0;bottom:16px;background:linear-gradient(180deg,#34d399,#059669);opacity:.92;border-radius:3px;}
.tlmain .tick{position:absolute;top:0;bottom:16px;width:1px;background:rgba(255,255,255,.14);}
.tlmain .ticklbl{position:absolute;bottom:3px;font-size:10px;color:#94a3b8;transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums;}
.tlmain .phead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.tlmain .pbub{position:absolute;top:4px;transform:translateX(-50%);background:var(--accent);color:#082032;font-size:10px;font-weight:800;padding:1px 7px;border-radius:7px;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none;}
.tlzoom{position:relative;height:34px;background:#0a1120;border:1px solid var(--line);border-radius:8px;margin-top:8px;cursor:pointer;overflow:hidden;}
.tlzoom .seg{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#34d39955,#05966955);}
.tlzoom .tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.10);}
.tlzoom .tick.major{background:rgba(255,255,255,.30);}
.tlzoom .ticklbl{position:absolute;top:5px;transform:translateX(4px);font-size:9px;color:#94a3b8;white-space:nowrap;font-variant-numeric:tabular-nums;}
.tlzoom .phead{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);}
.plzoomrow{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.segctl{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.segctl button{background:#16203a;border:none;color:var(--muted);padding:6px 11px;font-size:12px;cursor:pointer;font-weight:700;}
.segctl button.on{background:var(--accent);color:#082032;}
#gotoPlayer{position:fixed;right:14px;bottom:20px;z-index:70;display:none;box-shadow:var(--shadow);}
@media (max-width:900px){ #gotoPlayer{bottom:84px;} .plvideo video{max-height:40vh;} }
</style>

<div class="plwrap" id="playercard">
  <div class="plvideo" id="plvideo">
    <video id="video" muted autoplay playsinline></video>
  </div>
  <div class="plctl">
    <button class="plbtn" id="btn-play" title="Пуск/пауза">⏸</button>
    <button class="plbtn" id="btn-mute" title="Звук">🔇</button>
    <button class="plbtn" id="btn-full" title="Во весь экран">⛶</button>
    {% if LIVE_SRC %}<button class="btn ghost mini" id="btn-live" type="button">Лайв</button>{% endif %}
    <span class="plclock" id="plclock">--:--:--</span>
    <span class="plfile" id="plfile"></span>
    <span style="flex:1"></span>
    <input type="text" id="jump" placeholder="ЧЧ:ММ:СС" style="width:100px;">
    <button class="btn ghost mini" type="button" onclick="jumpTo()">К времени</button>
    <button class="btn ghost mini" id="btn-collapse" type="button">Свернуть</button>
  </div>
  <div class="tlmain" id="ptl" title="Шкала файла: клик/протяжка = посекундно"></div>
  <div class="plzoomrow">
    <div class="segctl" id="wrwctl">
      <button type="button" data-w="60">1 мин</button>
      <button type="button" data-w="300" class="on">5 мин</button>
      <button type="button" data-w="3600">1 час</button>
      <button type="button" data-w="0">весь</button>
    </div>
    <button class="plbtn sm" type="button" onclick="wrShift(-0.5)" title="Сдвинуть окно влево">‹</button>
    <button class="plbtn sm" type="button" onclick="wrShift(0.5)" title="Сдвинуть окно вправо">›</button>
    <label class="muted"><input type="checkbox" id="wrf" checked> следить</label>
    <span class="muted" id="wrinfo"></span>
  </div>
  <div class="tlzoom" id="wr" title="Лупа: клик = переход в секунду"></div>
</div>
<button class="btn ghost" id="gotoPlayer" type="button">↑ Плеер</button>

<script>
const ARCH_BASE = "{{ ARCH_BASE }}";
const CUTS_BASE = "{{ CUTS_BASE if CUTS_BASE else '' }}";
const LIVE_SRC = "{{ LIVE_SRC if LIVE_SRC else '' }}";
const DAYS = {{ DAYS_JSON | safe }};
const video = document.getElementById("video");
const playerCard = document.getElementById("playercard");
let hls = null, isLive = true, curMode = "linear", curBase = 0, curMap = [];
let wrW = 300, wr0 = null, wrFollow = true;
function fmtHMS(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");}
function parseHMS(v){const m=String(v).match(/^(\d{1,2}):(\d{2}):(\d{2})$/);return m?(+m[1])*3600+(+m[2])*60+(+m[3]):0;}
function absToCur(T){ if(curMode==="linear")return T-curBase; for(const m of curMap){if(T>=m.a&&T<m.b)return m.o+(T-m.a);} return null; }
function curToAbs(ct){ if(curMode==="linear")return curBase+ct; for(const m of curMap){const l=m.b-m.a; if(ct>=m.o&&ct<m.o+l)return m.a+(ct-m.o);} return curBase+ct; }
function covList(){ if(curMode==="map"&&curMap.length)return curMap; if(video.duration&&isFinite(video.duration))return [{a:curBase,b:curBase+video.duration,o:0}]; return []; }
function niceStep(span,maxT){ const st=[1,5,10,30,60,300,900,1800,3600,7200,14400]; for(const s of st){ if(span/s<=maxT)return s; } return 86400; }
function renderMain(){
  const el=document.getElementById("ptl"); el.innerHTML="";
  const cov=covList(), dur=video.duration;
  if(!cov.length||!dur||!isFinite(dur))return;
  cov.forEach(c=>{const z=document.createElement("div");z.className="seg";z.style.left=(c.o/dur*100)+"%";z.style.width=Math.max(0.3,(c.b-c.a)/dur*100)+"%";z.title=fmtHMS(c.a)+"–"+fmtHMS(c.b);el.appendChild(z);});
  const A0=cov[0].a,A1=cov[cov.length-1].b,st=niceStep(A1-A0,8);
  for(let t=Math.ceil(A0/st)*st;t<A1;t+=st){
    const ct=absToCur(t); if(ct==null||ct<0||ct>dur)continue;
    const tk=document.createElement("div");tk.className="tick";tk.style.left=(ct/dur*100)+"%";el.appendChild(tk);
    const lb=document.createElement("div");lb.className="ticklbl";lb.style.left=(ct/dur*100)+"%";lb.textContent=st<60?fmtHMS(t):fmtHMS(t).slice(0,5);el.appendChild(lb);
  }
  const h=document.createElement("div");h.className="phead";h.id="phead";el.appendChild(h);
  const b=document.createElement("div");b.className="pbub";b.id="pbub";el.appendChild(b);
  updateMain();
}
function updateMain(){
  const dur=video.duration;
  const h=document.getElementById("phead"),b=document.getElementById("pbub");
  const clk=document.getElementById("plclock"),fl=document.getElementById("plfile");
  if(isLive){ clk.textContent="LIVE"; fl.textContent="прямой эфир"; if(h){h.style.display="none";b.style.display="none";} return; }
  if(!dur||!isFinite(dur)||!h)return;
  const p=video.currentTime/dur*100;
  h.style.display="";b.style.display="";
  h.style.left=p+"%"; b.style.left=p+"%"; b.textContent=fmtHMS(curToAbs(video.currentTime));
  clk.textContent=fmtHMS(curToAbs(video.currentTime));
  fl.textContent="в файле "+fmtHMS(video.currentTime)+" / "+fmtHMS(dur);
}
function seekMain(e){
  const el=document.getElementById("ptl"),dur=video.duration;
  if(!dur||!isFinite(dur))return;
  const r=el.getBoundingClientRect();
  video.currentTime=Math.max(0,Math.min(dur-0.05,(e.clientX-r.left)/r.width*dur));
  video.play().catch(function(){});
}
function renderZoom(){
  const el=document.getElementById("wr"); el.innerHTML="";
  const cov=covList(),dur=video.duration;
  if(!cov.length||!dur||!isFinite(dur))return;
  const A0=cov[0].a,A1=cov[cov.length-1].b;
  let W=wrW; if(!W)W=A1-A0;
  if(wr0==null)wr0=A0;
  wr0=Math.max(A0,Math.min(wr0,A1-W));
  const st=W<=60?1:W<=300?5:W<=3600?60:300;
  const lst=W<=60?10:W<=300?60:W<=3600?600:3600;
  cov.forEach(c=>{const a=Math.max(c.a,wr0),b=Math.min(c.b,wr0+W);if(b>a){const z=document.createElement("div");z.className="seg";z.style.left=((a-wr0)/W*100)+"%";z.style.width=((b-a)/W*100)+"%";el.appendChild(z);}});
  for(let t=Math.ceil(wr0/st)*st;t<wr0+W;t+=st){
    const tk=document.createElement("div");tk.className="tick"+(t%lst===0?" major":"");tk.style.left=((t-wr0)/W*100)+"%";el.appendChild(tk);
    if(t%lst===0){const lb=document.createElement("div");lb.className="ticklbl";lb.style.left=((t-wr0)/W*100)+"%";lb.textContent=fmtHMS(t);el.appendChild(lb);}
  }
  const h=document.createElement("div");h.className="phead";h.id="wrhead";el.appendChild(h);
  document.getElementById("wrinfo").textContent="окно "+fmtHMS(wr0)+" – "+fmtHMS(wr0+W);
  updateZoom();
}
function updateZoom(){
  const h=document.getElementById("wrhead"); if(!h)return;
  const cov=covList(); if(!cov.length)return;
  const A0=cov[0].a,A1=cov[cov.length-1].b;
  let W=wrW; if(!W)W=A1-A0;
  const cur=curToAbs(video.currentTime);
  if(wrFollow&&(cur<wr0||cur>wr0+W)){ wr0=Math.max(A0,Math.min(cur-W/2,A1-W)); renderZoom(); return; }
  h.style.left=Math.max(0,Math.min(100,(cur-wr0)/W*100))+"%";
}
function seekZoom(e){
  const el=document.getElementById("wr"),dur=video.duration;
  if(!dur||!isFinite(dur))return;
  const cov=covList(); if(!cov.length)return;
  const A0=cov[0].a,A1=cov[cov.length-1].b;
  let W=wrW; if(!W)W=A1-A0;
  const r=el.getBoundingClientRect();
  const T=wr0+(e.clientX-r.left)/r.width*W;
  const ct=absToCur(T);
  if(ct==null||ct<0||ct>dur){toast("На "+fmtHMS(T)+" записи в файле нет");return;}
  video.currentTime=ct; video.play().catch(function(){});
}
function wrShift(f){
  const cov=covList(); if(!cov.length)return;
  const A0=cov[0].a,A1=cov[cov.length-1].b;
  let W=wrW; if(!W)W=A1-A0;
  if(wr0==null)wr0=A0;
  wr0=Math.max(A0,Math.min(wr0+W*f,A1-W));
  renderZoom();
}
function wrCenter(){
  const cov=covList(); if(!cov.length)return;
  const A0=cov[0].a,A1=cov[cov.length-1].b;
  let W=wrW; if(!W)W=A1-A0;
  wr0=Math.max(A0,Math.min(curToAbs(video.currentTime)-W/2,A1-W));
  renderZoom();
}
function bindDrag(el,fn){
  let d=false;
  el.addEventListener("mousedown",function(e){d=true;fn(e);e.preventDefault();});
  window.addEventListener("mousemove",function(e){if(d)fn(e);});
  window.addEventListener("mouseup",function(){d=false;});
  el.addEventListener("touchstart",function(e){d=true;fn(e.touches[0]);},{passive:true});
  el.addEventListener("touchmove",function(e){if(d)fn(e.touches[0]);},{passive:true});
  window.addEventListener("touchend",function(){d=false;});
}
function jumpTo(){
  if(isLive){toast("Прямой эфир");return;}
  const v=document.getElementById("jump").value.trim();
  if(!/^\d{1,2}:\d{2}:\d{2}$/.test(v)){toast("Формат: ЧЧ:ММ:СС");return;}
  const ct=absToCur(parseHMS(v));
  const dur=video.duration;
  if(ct==null||ct<0||(dur&&isFinite(dur)&&ct>dur)){toast("Времени "+v+" в файле нет");return;}
  video.currentTime=ct; video.play().catch(function(){});
}
function startVideo(url,seekAbs,label){
  if(hls){hls.destroy();hls=null;}
  isLive=false;
  const ct=seekAbs===null?0:absToCur(seekAbs);
  video.src=url;
  video.addEventListener("loadedmetadata",function onm(){
    video.removeEventListener("loadedmetadata",onm);
    if(ct!==null&&ct>0)video.currentTime=ct;
    video.play().catch(function(){});
  });
  document.getElementById("plfile").textContent=label||"";
}
function playLinear(url,baseSec,label){curMode="linear";curBase=baseSec||0;curMap=[];wr0=null;startVideo(url,baseSec,label);}
function playMap(url,map,seekAbs,label){curMode="map";curMap=map||[];curBase=(map&&map.length)?map[0].a:0;wr0=null;startVideo(url,seekAbs,label);}
function playDay(file,day){
  const d=DAYS.find(x=>x.day===day);
  if(d&&d.map&&d.map.length)playMap(ARCH_BASE+file,d.map,d.map[0].a,file);
  else playLinear(ARCH_BASE+file,0,file);
}
function playLive(){
  if(!LIVE_SRC){toast("На этой странице нет лайва");return;}
  if(hls){hls.destroy();hls=null;}
  video.removeAttribute("src");
  isLive=true;curMode="linear";curBase=0;curMap=[];wr0=null;
  if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(LIVE_SRC);hls.attachMedia(video);}
  else{video.src=LIVE_SRC;}
  document.getElementById("plclock").textContent="LIVE";
  document.getElementById("ptl").innerHTML="";document.getElementById("wr").innerHTML="";
  video.play().catch(function(){});
}
video.addEventListener("loadedmetadata",function(){renderMain();renderZoom();});
video.addEventListener("timeupdate",function(){updateMain();updateZoom();});
video.addEventListener("play",function(){document.getElementById("btn-play").textContent="⏸";});
video.addEventListener("pause",function(){document.getElementById("btn-play").textContent="▶";});
document.getElementById("btn-play").addEventListener("click",function(){ if(video.paused)video.play().catch(function(){}); else video.pause(); });
document.getElementById("btn-mute").addEventListener("click",function(){ video.muted=!video.muted; this.textContent=video.muted?"🔇":""; });
document.getElementById("btn-full").addEventListener("click",function(){ const v=document.getElementById("plvideo"); if(document.fullscreenElement)document.exitFullscreen(); else v.requestFullscreen&&v.requestFullscreen(); });
{% if LIVE_SRC %}document.getElementById("btn-live").addEventListener("click",playLive);{% endif %}
document.getElementById("btn-collapse").addEventListener("click",function(){
  const v=document.getElementById("plvideo");
  const hid=v.style.display==="none";
  v.style.display=hid?"":"none";
  this.textContent=hid?"Свернуть":"Развернуть";
  if(!hid)video.pause();
});
document.querySelectorAll("#wrwctl button").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll("#wrwctl button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); wrW=+b.dataset.w; wr0=null; renderZoom();
  });
});
document.getElementById("wrf").addEventListener("change",function(){wrFollow=this.checked;});
bindDrag(document.getElementById("ptl"),seekMain);
bindDrag(document.getElementById("wr"),seekZoom);
const gotoBtn=document.getElementById("gotoPlayer");
function updateGoto(){
  const r=playerCard.getBoundingClientRect();
  gotoBtn.style.display=(r.bottom<0||r.top>window.innerHeight)?"":"none";
}
window.addEventListener("scroll",updateGoto,{passive:true});
gotoBtn.addEventListener("click",function(){playerCard.scrollIntoView({behavior:"smooth",block:"start"});});
{% if LIVE_SRC %}playLive();{% endif %}
</script>
